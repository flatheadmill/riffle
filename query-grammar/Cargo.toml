[package]
name = "riffle-query-grammar"
version = "0.1.0"
authors = ["Paul Masurel <paul.masurel@gmail.com>"]
license = "MIT"
categories = ["database-implementations", "data-structures"]
description = "Riffle query grammar"
homepage = "https://github.com/flatheadmill/riffle"
repository = "https://github.com/flatheadmill/riffle"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[dependencies]
nom = "7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ordered-float = { version = "5.0.0", features = ["serde"] }
fnv = "1.0.7"
